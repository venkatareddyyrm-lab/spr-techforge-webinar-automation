trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  browser: chrome
  headless: true
  dotnetVersion: 8.0.x

steps:
- task: UseDotNet@2
  displayName: Install .NET 8 SDK
  inputs:
    packageType: sdk
    version: $(dotnetVersion)

- script: |
    dotnet --info
    dotnet restore SprTechForge.Automation.csproj
  displayName: Restore

- script: |
    dotnet build SprTechForge.Automation.csproj \
      --configuration $(buildConfiguration) \
      --no-restore
  displayName: Build

- script: |
    export BROWSER="$(browser)"
    export HEADLESS="$(headless)"

    dotnet test SprTechForge.Automation.csproj \
      --configuration $(buildConfiguration) \
      --no-build \
      --filter "TestCategory=WebinarRegistration" \
      --logger "trx;LogFileName=webinar-registration.trx" \
      --results-directory "$(Build.SourcesDirectory)/TestResults"
  displayName: Run Reqnroll UI tests

- task: PublishTestResults@2
  displayName: Publish test results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Build.SourcesDirectory)/TestResults/**/*.trx'
    searchFolder: '$(Build.SourcesDirectory)/TestResults'
    mergeTestResults: true
    failTaskOnFailedTests: false
    testRunTitle: 'SPR TechForge Webinar Registration UI Automation'

- task: PublishPipelineArtifact@1
  displayName: Publish failed screenshots
  condition: succeededOrFailed()
  inputs:
    targetPath: '$(Build.SourcesDirectory)/bin/$(buildConfiguration)/net8.0/Artifacts/Screenshots'
    artifact: 'Failed-Screenshots'
    publishLocation: pipeline